name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push' && vars.DEPLOY_ON_PUSH == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      INCOMING: /srv/branded/incoming/github

    steps:
      - name: Check deployment settings
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]+$ ]] || { echo 'Set DEPLOY_HOST in repository Variables'; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'Set DEPLOY_USER in repository Variables'; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || { echo 'DEPLOY_PORT must be numeric'; exit 1; }
          [[ -n "$SSH_KEY" && -n "$KNOWN_HOSTS" ]] || { echo 'Set DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS in repository Secrets'; exit 1; }

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 26.13.0
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npx nuxi typecheck
      - run: npm test
      - name: Identify artifact
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="${SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("public/deploy-meta.json", JSON.stringify({sha:process.env.SHA,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT}));'

      - run: npm run build

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' \
            'Host branded-production' \
            "  HostName $DEPLOY_HOST" \
            "  User $DEPLOY_USER" \
            "  Port $DEPLOY_PORT" \
            '  IdentityFile ~/.ssh/id_ed25519' \
            '  IdentitiesOnly yes' \
            '  BatchMode yes' \
            '  StrictHostKeyChecking yes' \
            '  ConnectTimeout 15' > ~/.ssh/config
          ssh branded-production 'sudo -n /usr/local/sbin/branded-deploy --status'

      - name: Upload artifact
        shell: bash
        run: |
          set -euo pipefail
          ssh branded-production "install -d -m 0755 '$INCOMING/$RELEASE/.output'"
          rsync -az --safe-links --chmod=D755,F644 --delete .output/ "branded-production:$INCOMING/$RELEASE/.output/"

      - name: Activate release
        shell: bash
        run: |
          set -euo pipefail
          ssh branded-production "sudo -n /usr/local/sbin/branded-deploy '$INCOMING/$RELEASE' '$RELEASE'"

      - name: Verify public release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 https://branded.com.ua/deploy-meta.json > deployed.json
          node --input-type=module -e 'import fs from "node:fs"; const d=JSON.parse(fs.readFileSync("deployed.json","utf8")); if(d.sha!==process.env.SHA || d.run!==process.env.GITHUB_RUN_ID) process.exit(1); console.log("Public build verified:",d.sha);'
          curl --fail --silent --show-error --max-time 30 -o /dev/null https://branded.com.ua/
          echo "### Deployed $SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'https://branded.com.ua/' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary upload
        if: always() && env.RELEASE != ''
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^[a-f0-9]{12}-[0-9]+-[0-9]+$ ]] || exit 1
          ssh branded-production "rm -rf -- '$INCOMING/$RELEASE'"
